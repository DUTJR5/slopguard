name: Bug report
description: Report a problem with slopguard
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear and concise description of the bug.
      placeholder: When I run `slopguard scan` on ..., it ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopguard version
      description: The version line from `slopguard --help`, or `npm ls slopguard`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.11.0"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem? Include the command and the project layout if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any error output. Use `--format json` for machine-readable output.
      render: shell
    validations:
      required: false
